<div class="ai-insight-wrap mx-auto">
  <div id="ai-insight" class="ai-insight card">
    <div class="card-body">
      <div class="ai-market-header d-flex align-items-center gap-2">
        <span class="ai-market-icon">✦</span>
        <div>
          <div class="ai-market-eyebrow">AI-POWERED MARKET ANALYSIS</div>
          <strong class="ai-market-title">AI Market Insight</strong>
        </div>
        <span class="badge live-scan-badge ms-auto">MARKET OPPORTUNITY</span>
      </div>
      <div class="ai-market-country" id="ai-insight-country">-</div>
      <p id="ai-insight-summary" class="ai-insight-summary">HS 코드를 검색하고 국가를 선택하면 시장 요약이 표시됩니다.</p>

      <div id="ai-insight-kpis" class="ai-insight-kpis"></div>

      <section class="ai-market-section">
        <div class="ai-market-section-heading"><span>01</span><h3>Why This Market?</h3></div>
        <div id="ai-why-market" class="ai-market-card-grid three"></div>
      </section>

      <section class="ai-market-section">
        <div class="ai-market-section-heading"><span>02</span><h3>Export Attractiveness</h3></div>
        <div id="ai-export-attractiveness" class="ai-market-card-grid three"></div>
      </section>

      <section class="ai-market-section">
        <div class="ai-market-section-heading"><span>03</span><h3>Market Watch</h3></div>
        <div id="ai-market-watch" class="ai-market-card-grid two"></div>
        <div id="ai-market-watch-empty" class="ai-market-empty d-none">확인된 주요 뉴스·규제 이슈가 없습니다.</div>
      </section>

      <section class="ai-market-section ai-interpretation-section">
        <div class="ai-market-section-heading"><span>04</span><h3>AI 종합 의견</h3></div>
        <div id="ai-interpretation" class="ai-interpretation"></div>
        <div id="ai-key-conclusion" class="ai-key-conclusion"></div>
      </section>

      <div class="ai-insight-footer text-muted small d-flex justify-content-between">
        <span id="ai-insight-target">Target: -</span>
        <span id="ai-insight-engine">Predator Engine</span>
      </div>
    </div>
  </div>
</div>
