<div class="ai-insight-wrap mx-auto">
  <div id="ai-insight" class="ai-insight card">
    <div class="card-body">
      <div class="ai-insight-header d-flex align-items-center gap-2 mb-2">
        <span>💡</span>
        <strong>AI Insight</strong>
        <span class="badge live-scan-badge">Live AI Scan</span>
        <span id="ai-insight-country" class="text-muted ms-auto">-</span>
      </div>
      <p id="ai-insight-body" class="ai-insight-body">HS 코드를 검색하면 AI Insight가 표시됩니다.</p>
      <div id="ai-insight-chips" class="ai-insight-chips d-flex flex-wrap gap-2 mb-2"></div>

      <div id="ai-insight-reference-block" class="ai-insight-block d-none">
        <div class="ai-insight-block-label">레퍼런스</div>
        <p id="ai-insight-reference" class="ai-insight-block-text mb-0"></p>
      </div>

      <div id="ai-insight-contacts-block" class="ai-insight-block d-none">
        <div class="ai-insight-block-label">접촉 채널 <span class="ai-insight-ref-badge">참고용</span></div>
        <ul id="ai-insight-contacts" class="ai-insight-list mb-0"></ul>
      </div>

      <div id="ai-insight-timeline-block" class="ai-insight-block d-none">
        <div class="ai-insight-block-label">준비 타임라인</div>
        <ul id="ai-insight-timeline" class="ai-insight-list mb-0"></ul>
      </div>

      <div id="ai-insight-risks-block" class="ai-insight-block d-none">
        <div class="ai-insight-block-label">리스크</div>
        <ul id="ai-insight-risks" class="ai-insight-list ai-insight-risks mb-0"></ul>
      </div>

      <div id="ai-insight-gov-block" class="ai-insight-block d-none">
        <div class="ai-insight-block-label">정부 지원사업 매칭 <span class="ai-insight-ref-badge">참고용</span></div>
        <ul id="ai-insight-gov" class="ai-insight-list mb-0"></ul>
      </div>

      <p id="ai-insight-limitation" class="ai-insight-limitation text-muted small mb-2 d-none"></p>

      <div class="ai-insight-footer text-muted small d-flex justify-content-between">
        <span id="ai-insight-target">Target: -</span>
        <span>Predator Engine</span>
      </div>
    </div>
  </div>
</div>
